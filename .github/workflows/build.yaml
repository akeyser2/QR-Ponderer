name: Build & Release Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: OrbQR-Windows.exe
            upload_path: dist/OrbQR.exe

          - os: macos-latest
            asset_name: OrbQR-macOS.zip
            upload_path: OrbQR-macOS.zip

          - os: ubuntu-22.04
            asset_name: OrbQR-Linux.tar.gz
            upload_path: OrbQR-Linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xclip wl-clipboard

      - name: Install Python Packages
        run: |
            python -m pip install --upgrade pip
            pip install "qrcode[pil]" pyinstaller

      - name: Install Windows Clipboard Package
        if: runner.os == 'Windows'
        run: pip install pywin32

      - name: Download Pixel Font
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/google/fonts/main/ofl/jacquardabastarda9/JacquardaBastarda9-Regular.ttf', 'JacquardaBastarda9-Regular.ttf')"

      - name: Build Windows Executable (.exe)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "OrbQR" --icon "orb.ico" --add-data "wiz.png;." --add-data "orb.ico;." --add-data "JacquardaBastarda9-Regular.ttf;." gen_gui.py

      - name: Build & Package macOS App (.app inside .zip)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "OrbQR" --icon "orb.ico" --add-data "wiz.png:." --add-data "orb.ico:." --add-data "JacquardaBastarda9-Regular.ttf:." gen_gui.py
          codesign --force --deep --sign - dist/OrbQR.app
          ditto -c -k --sequesterRsrc --keepParent dist/OrbQR.app OrbQR-macOS.zip

      - name: Build & Package Linux Binary (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "OrbQR" --icon "orb.ico" --add-data "wiz.png:." --add-data "orb.ico:." --add-data "JacquardaBastarda9-Regular.ttf:." gen_gui.py
          chmod +x dist/OrbQR
          tar -czvf OrbQR-Linux.tar.gz -C dist OrbQR

      - name: Upload Build Artifacts (For Manual Runs)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.upload_path }}

      - name: Publish to GitHub Releases (When Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.upload_path }}
          generate_release_notes: true
